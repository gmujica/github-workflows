name: CI

# Reusable. Nothing here triggers on its own — a project calls it:
#
#   jobs:
#     ci:
#       uses: gmujica/github-workflows/.github/workflows/ci.yml@main
#       with:
#         production_url: https://mi-worker.gmujica.workers.dev
#         preview_url: https://dev-mi-worker.gmujica.workers.dev
#
# See examples/ci.yml for the full caller.
#
# `actions/checkout` below clones the *calling* repository, not this one, which
# is what makes the whole thing work: the lint, the tests and the build all run
# against the project's own code. It is also why the smoke test and the URL
# resolution are composite actions instead of scripts — a path like
# ./.github/scripts/smoke.sh would resolve against the caller, where it does
# not exist. Action code is fetched by the runner, so it travels with the ref.
on:
  workflow_call:
    inputs:
      production_url:
        description: Public URL of the production Worker. Used as the smoke-test fallback.
        required: true
        type: string
      preview_url:
        description: Stable alias URL of the preview Worker.
        required: true
        type: string
      production_branch:
        description: Branch whose pushes deploy to production.
        required: false
        type: string
        default: main
      preview_branch:
        description: Branch whose pushes upload a preview version.
        required: false
        type: string
        default: dev
      node_version_file:
        description: File holding the Node version, read by CI and Workers Builds alike.
        required: false
        type: string
        default: .node-version
      bundle_limit_bytes:
        description: >
          Gzipped bundle ceiling. Workers Free caps a script at 3 MiB; the
          default leaves room to notice the trend before hitting it. Raise to
          10 MiB once the account moves to Workers Paid.
        required: false
        type: number
        default: 2500000
      run_lint:
        description: Set false for a project that has no `lint` script yet.
        required: false
        type: boolean
        default: true
      artifact_retention_days:
        description: How long the built bundles stay downloadable.
        required: false
        type: number
        default: 7

# No `secrets:` block on purpose. CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# are environment secrets in the calling repository, and the deploy jobs below
# reach them by declaring `environment:` — that is what keeps the preview job
# from being able to read the production token. Declaring them here as
# workflow_call secrets would shadow the environment ones with empty strings
# whenever a caller forgot to pass them, which fails as a 401 halfway through a
# deploy rather than as a missing input.

# A second push to the same branch cancels the run still in flight — except on
# pushes, which are the runs that deploy. Killing one of those halfway is worse
# than paying for a minute of CI that a newer commit has already superseded.
# Keyed by repository as well as ref: one reusable workflow now serves every
# project, and two of them sharing a branch name must not share a lock.
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Without this the GITHUB_TOKEN inherits whatever the organisation defaults to,
# which is usually write. No job here pushes commits, comments or releases.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version: local dev, CI, and
          # Cloudflare Workers Builds all read the same file. Vite 8 and
          # jsdom 29 both need >=20.19, so anything older will not install.
          node-version-file: ${{ inputs.node_version_file }}
          cache: npm

      - run: npm ci

      - if: inputs.run_lint
        run: npm run lint

      - run: npm test

      # Catches build-only failures the tests cannot see, such as a bad import
      # path that Vitest resolves but Rollup does not.
      - run: npm run build

      # The deploy jobs ship *this* bundle rather than rebuilding their own.
      # Two builds from two runners are usually identical, but "usually" is
      # what makes the exceptions expensive: a floating transitive dependency
      # or a partial install produces an artefact nothing ever tested.
      - name: Keep the production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-production-${{ github.sha }}
          path: dist/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      # Validates the wrangler config, the bindings and the whole bundling step
      # without credentials and without touching the account. Everything this
      # catches would otherwise surface only after a merge, as a red deploy.
      - name: Validate the deploy without deploying
        run: npx wrangler deploy --dry-run --outdir=.dry-run

      - name: Bundle size guard
        env:
          LIMIT: ${{ inputs.bundle_limit_bytes }}
        run: |
          SIZE=$(find .dry-run -name '*.js' -exec cat {} + | gzip -c | wc -c)
          echo "Bundle (gzip): $((SIZE / 1024)) KB — limit $((LIMIT / 1024)) KB"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::Bundle over the limit"
            exit 1
          fi

      # `--mode preview` reads .env.preview, and nothing else in this pipeline
      # ever reads that file. Building it here means a typo in it fails on the
      # pull request instead of on the first push to the preview branch.
      - run: npm run build:preview

      - name: Keep the preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-preview-${{ github.sha }}
          path: dist/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

  # Every push to the preview branch uploads a new version of the Worker and
  # points its alias at it. A version is not a deployment: production keeps
  # serving whatever the production branch last deployed, untouched. The alias
  # URL is stable across pushes, so a link shared once goes on showing the
  # latest build.
  preview:
    needs: check
    if: github.ref == format('refs/heads/{0}', inputs.preview_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The URL comes from what Cloudflare reported, not from a constant, so it
    # follows the Worker if it ever moves to a custom domain. `steps` is a
    # context GitHub permits here because the field is evaluated once the job
    # has finished. It also scopes CLOUDFLARE_API_TOKEN: held as an environment
    # secret in the calling repository, this job cannot read the production one
    # and vice versa.
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: npm

      # Installs wrangler at the version the lockfile pins. No build follows:
      # the bundle comes from `check`, already linted, tested and measured.
      - run: npm ci

      - name: Restore the tested preview bundle
        uses: actions/download-artifact@v8
        with:
          name: dist-preview-${{ github.sha }}
          path: dist/

      # `--tag` and `--message` are the only thread back to here. Cloudflare
      # records the version but knows nothing of the build that produced it, so
      # without them its Deployments tab is a list of bare hashes and timestamps.
      # The subject is cut at 80 characters because commit subjects here are not
      # always short and the annotation is read in a narrow column.
      #
      # WRANGLER_OUTPUT_FILE_PATH makes wrangler write an ND-JSON record per
      # operation alongside its usual logs — worker name, version id, and the
      # HTTP targets it just wired up.
      - name: Upload the preview version
        id: deploy
        run: |
          npm run deploy:preview -- \
            --tag "$(git rev-parse --short HEAD)" \
            --message "$(git log -1 --pretty=%s | cut -c1-80) · run ${{ github.run_number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson

      - name: Resolve the uploaded URL
        id: url
        uses: gmujica/github-workflows/.github/actions/worker-url@main
        with:
          ndjson-path: ${{ runner.temp }}/wrangler.ndjson
          fallback-url: ${{ inputs.preview_url }}

      - name: Smoke test
        uses: gmujica/github-workflows/.github/actions/smoke@main
        with:
          url: ${{ steps.url.outputs.url }}

      - name: Summarise the preview link
        env:
          PREVIEW_LINK: ${{ steps.url.outputs.url }}
        run: |
          {
            echo "### Preview"
            echo
            echo "<$PREVIEW_LINK>"
            echo
            echo "Points at the staging API, so nothing here touches production data."
          } >> "$GITHUB_STEP_SUMMARY"

  # Production, and the only job that changes what the public URL serves.
  # Reached by merging into the production branch, never by pushing to preview.
  deploy:
    needs: check
    if: github.ref == format('refs/heads/{0}', inputs.production_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: production
      url: ${{ steps.url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: npm

      - run: npm ci

      - name: Restore the tested production bundle
        uses: actions/download-artifact@v8
        with:
          name: dist-production-${{ github.sha }}
          path: dist/

      # Same annotations as the preview job. On the production branch the
      # subject is usually the merge commit's — "Merge pull request #14 from
      # gmujica/dev" — which is what makes the version findable from the PR it
      # came from, and what makes it selectable in rollback.yml when one has to
      # be undone.
      - name: Deploy to production
        id: deploy
        run: |
          npm run deploy:cf -- \
            --tag "$(git rev-parse --short HEAD)" \
            --message "$(git log -1 --pretty=%s | cut -c1-80) · run ${{ github.run_number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson

      - name: Resolve the deployed URL
        id: url
        uses: gmujica/github-workflows/.github/actions/worker-url@main
        with:
          ndjson-path: ${{ runner.temp }}/wrangler.ndjson
          fallback-url: ${{ inputs.production_url }}

      # wrangler exits 0 once Cloudflare accepts the upload, which says nothing
      # about whether the Worker serves a request. A missing binding or an unset
      # secret is a 500 on the first hit and a green pipeline.
      - name: Smoke test
        uses: gmujica/github-workflows/.github/actions/smoke@main
        with:
          url: ${{ steps.url.outputs.url }}

      - name: Summarise the deploy
        env:
          DEPLOY_LINK: ${{ steps.url.outputs.url }}
        run: |
          {
            echo "### Production"
            echo
            echo "<$DEPLOY_LINK> · \`$(git rev-parse --short HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
