# Copiar a .github/workflows/ci.yml en el proyecto y reemplazar los dos
# placeholders. Esto es todo lo que un proyecto necesita: el pipeline vive
# en el repo base.

name: CI

on:
  push:
    # Tienen que coincidir con production_branch y preview_branch de abajo.
    # Si no coinciden, el job corre y no despliega nada, en silencio.
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    # @main sigue la rama: un cambio en el repo base entra en todos los
    # proyectos en el siguiente run, sin avisar. Comodo mientras el pipeline
    # se esta asentando, mal negocio despues. Cuando exista el tag, cambiar
    # a @v1 aca y dejar que Dependabot proponga los saltos.
    uses: gmujica/github-workflows/.github/workflows/ci.yml@main
    with:
      production_url: https://NOMBRE-DEL-WORKER.TU-SUBDOMINIO.workers.dev
      preview_url: https://dev-NOMBRE-DEL-WORKER.TU-SUBDOMINIO.workers.dev

      # Solo si el proyecto no usa main/dev. Un repo viejo con master pondria:
      #   production_branch: master
      #   preview_branch: dev

      # Opcionales, con estos defaults:
      #   node_version_file: .node-version
      #   bundle_limit_bytes: 2500000
      #   run_lint: true
      #   artifact_retention_days: 7
